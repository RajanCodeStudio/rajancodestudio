<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rajan Code Studio</title>

    <!-- Google Material Symbols & Fonts (Material 3) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <!-- Tailwind CSS (Auto Dark Mode Enabled by System Default) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media', // Auto Dark Mode based on Device OS Settings
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Google Sans', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- React 18 & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#F8FDFF] dark:bg-[#141218] text-[#1F1F1F] dark:text-[#E6E0E9] font-sans antialiased min-h-screen transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // =========================================================
        // 1. ATOMS (Google Atomic Design Pattern)
        // =========================================================
        
        // Atom: Material Symbol Icon
        const Icon = ({ name, className = "" }) => (
            <span className={`material-symbols-outlined select-none ${className}`}>{name}</span>
        );

        // Atom: Material 3 Filter Chip
        const Chip = ({ label, icon }) => (
            <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#E1E3E1] dark:bg-[#332D41] text-[#444746] dark:text-[#E8DEF8] text-xs font-medium border border-transparent dark:border-[#49454F]/40 transition-colors">
                {icon && <Icon name={icon} className="text-sm text-[#0B57D0] dark:text-[#D0BCFF]" />}
                <span>{label}</span>
            </div>
        );

        // Atom: Material 3 Button (Filled / Tonal / Outlined)
        const M3Button = ({ href, children, variant = "filled", icon, target = "_self" }) => {
            const baseStyles = "w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 rounded-full text-sm font-medium transition-all duration-200 active:scale-95 shadow-sm hover:shadow-md";
            const variants = {
                filled: "bg-[#0B57D0] text-white hover:bg-[#0842A0] dark:bg-[#D0BCFF] dark:text-[#381E72] dark:hover:bg-[#E8DEF8]",
                tonal: "bg-[#D3E3FD] text-[#041E49] hover:bg-[#C2D7FA] dark:bg-[#381E72] dark:text-[#E8DEF8] dark:hover:bg-[#4F378B]",
                outlined: "border border-[#747775] text-[#0B57D0] hover:bg-[#0B57D0]/5 dark:border-[#938F99] dark:text-[#D0BCFF] dark:hover:bg-[#D0BCFF]/10"
            };

            return (
                <a href={href} target={target} rel="noopener noreferrer" className={`${baseStyles} ${variants[variant]}`}>
                    {icon && <Icon name={icon} className="text-lg" />}
                    <span>{children}</span>
                </a>
            );
        };

        // =========================================================
        // 2. MOLECULES (Google Atomic Design Pattern)
        // =========================================================

        // Molecule: Social Channel Card
        const SocialCard = ({ title, subtitle, icon, url, badgeText, btnVariant = "tonal" }) => (
            <div className="bg-[#F0F4F9] dark:bg-[#211F26] p-5 sm:p-6 rounded-[24px] border border-[#E1E3E1]/80 dark:border-[#36343B] hover:border-[#0B57D0]/40 dark:hover:border-[#D0BCFF]/40 transition-all duration-300 flex flex-col justify-between gap-5 shadow-sm">
                <div className="flex items-start justify-between gap-3">
                    <div className="flex items-center gap-3.5">
                        <div className="w-12 h-12 rounded-2xl bg-white dark:bg-[#2B2930] flex items-center justify-center shadow-sm text-[#0B57D0] dark:text-[#D0BCFF] shrink-0">
                            <Icon name={icon} className="text-2xl" />
                        </div>
                        <div className="min-w-0">
                            <h3 className="font-bold text-base text-[#1F1F1F] dark:text-[#E6E0E9] truncate">{title}</h3>
                            <p className="text-xs text-[#444746] dark:text-[#CAC4D0] truncate mt-0.5">{subtitle}</p>
                        </div>
                    </div>
                    {badgeText && <Chip label={badgeText} />}
                </div>
                <M3Button href={url} variant={btnVariant} icon="open_in_new" target="_blank">
                    Join / Follow
                </M3Button>
            </div>
        );

        // Molecule: App Item Card
        const AppCard = ({ name, description, privacyUrl, iconName }) => (
            <div className="bg-white dark:bg-[#211F26] p-5 sm:p-6 rounded-[28px] border border-[#E1E3E1] dark:border-[#36343B] shadow-sm hover:shadow-md transition-all duration-300 flex flex-col sm:flex-row sm:items-center justify-between gap-5">
                <div className="flex items-start sm:items-center gap-4">
                    <div className="w-14 h-14 rounded-2xl bg-[#D3E3FD] dark:bg-[#381E72] text-[#041E49] dark:text-[#D0BCFF] flex items-center justify-center font-bold text-2xl shadow-inner shrink-0">
                        <Icon name={iconName || "smartphone"} className="text-3xl" />
                    </div>
                    <div>
                        <div className="flex items-center gap-2 flex-wrap">
                            <h3 className="text-lg font-bold text-[#1F1F1F] dark:text-[#E6E0E9]">{name}</h3>
                            <Chip label="Official App" />
                        </div>
                        <p className="text-xs sm:text-sm text-[#444746] dark:text-[#CAC4D0] mt-1 leading-relaxed">{description}</p>
                    </div>
                </div>
                <div className="flex items-center gap-2 w-full sm:w-auto shrink-0 pt-2 sm:pt-0 border-t sm:border-t-0 border-[#E1E3E1] dark:border-[#36343B]">
                    <M3Button href={privacyUrl} variant="outlined" icon="policy">
                        Privacy Policy
                    </M3Button>
                </div>
            </div>
        );

        // =========================================================
        // 3. ORGANISMS (Google Atomic Design Pattern)
        // =========================================================

        // Organism: Top App Bar
        const Header = () => (
            <header className="sticky top-0 z-50 bg-[#F8FDFF]/80 dark:bg-[#141218]/80 backdrop-blur-md border-b border-[#E1E3E1] dark:border-[#36343B] px-4 sm:px-6 py-4 transition-colors">
                <div className="max-w-5xl mx-auto flex items-center justify-between gap-4">
                    <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-full bg-[#0B57D0] dark:bg-[#D0BCFF] text-white dark:text-[#381E72] flex items-center justify-center font-bold text-xl shadow-md shrink-0">
                            R
                        </div>
                        <span className="font-bold text-base sm:text-lg text-[#1F1F1F] dark:text-[#E6E0E9] tracking-tight">Rajan Code Studio</span>
                    </div>
                    <Chip label="Material You M3" icon="verified" />
                </div>
            </header>
        );

        // Organism: Hero Section
        const Hero = () => (
            <section className="text-center py-8 sm:py-12 px-4 max-w-3xl mx-auto">
                <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-[#D3E3FD] dark:bg-[#381E72] text-[#041E49] dark:text-[#E8DEF8] text-xs font-semibold mb-4 transition-colors">
                    <Icon name="code" className="text-base text-[#0B57D0] dark:text-[#D0BCFF]" /> Official Developer Studio
                </div>
                <h1 className="text-3xl sm:text-4xl md:text-5xl font-bold text-[#1F1F1F] dark:text-[#E6E0E9] tracking-tight leading-tight">
                    Rajan Code Studio
                </h1>
                <p className="text-sm sm:text-base md:text-lg text-[#444746] dark:text-[#CAC4D0] mt-3 sm:mt-4 leading-relaxed max-w-2xl mx-auto">
                    Building high-quality Android applications, utility solutions, and developer communities with Google Material 3 standards.
                </p>
            </section>
        );

        // Organism: Published Applications Section
        const AppShowcase = () => (
            <section className="my-8 sm:my-12">
                <div className="flex items-center gap-2 mb-4 sm:mb-6">
                    <Icon name="apps" className="text-[#0B57D0] dark:text-[#D0BCFF] text-2xl" />
                    <h2 className="text-xl sm:text-2xl font-bold text-[#1F1F1F] dark:text-[#E6E0E9]">Applications</h2>
                </div>
                <div className="space-y-4">
                    <AppCard 
                        name="Only 5G" 
                        description="Force 5G NR mode and smart network switch utility application." 
                        privacyUrl="/only-5g" 
                        iconName="5g"
                    />
                </div>
            </section>
        );

        // Organism: Socials & Community Grid
        const CommunitySection = () => (
            <section className="my-8 sm:my-12">
                <div className="flex items-center gap-2 mb-4 sm:mb-6">
                    <Icon name="groups" className="text-[#0B57D0] dark:text-[#D0BCFF] text-2xl" />
                    <h2 className="text-xl sm:text-2xl font-bold text-[#1F1F1F] dark:text-[#E6E0E9]">Community & Social Media</h2>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
                    <SocialCard 
                        title="Telegram Channel" 
                        subtitle="@RajanCodeStudio" 
                        icon="send" 
                        url="https://t.me/RajanCodeStudio" 
                        badgeText="Official"
                        btnVariant="filled"
                    />
                    <SocialCard 
                        title="Discussion Group" 
                        subtitle="@RajanCodeStudioCommunity" 
                        icon="forum" 
                        url="https://t.me/RajanCodeStudioCommunity" 
                        badgeText="Support"
                        btnVariant="tonal"
                    />
                    <SocialCard 
                        title="Instagram" 
                        subtitle="@botrakshakyt" 
                        icon="photo_camera" 
                        url="https://www.instagram.com/botrakshakyt" 
                        badgeText="Updates"
                        btnVariant="outlined"
                    />
                </div>
            </section>
        );

        // Organism: Footer
        const Footer = () => (
            <footer className="mt-16 sm:mt-20 border-t border-[#E1E3E1] dark:border-[#36343B] py-8 text-center text-xs text-[#444746] dark:text-[#CAC4D0] transition-colors px-4">
                <p>© 2026 Rajan Code Studio. Built with React & Google Material 3 Design Tokens.</p>
            </footer>
        );

        // =========================================================
        // 4. MAIN PAGE TEMPLATE
        // =========================================================
        function App() {
            return (
                <div className="min-h-screen flex flex-col justify-between">
                    <div>
                        <Header />
                        <main className="max-w-5xl mx-auto px-4 sm:px-6">
                            <Hero />
                            <AppShowcase />
                            <CommunitySection />
                        </main>
                    </div>
                    <Footer />
                </div>
            );
        }

        // Render React App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
