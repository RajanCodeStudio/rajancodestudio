<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rajan Code Studio</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: 50px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #007bff; margin-bottom: 10px; }
        p { color: #666; font-size: 16px; }
        .app-list { margin-top: 30px; text-align: left; }
        .app-card { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .app-title { font-weight: bold; font-size: 18px; color: #222; }
        .btn { background-color: #007bff; color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; }
        .btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Rajan Code Studio</h1>
        <p>Welcome to the official developer page of Rajan Code Studio.</p>

        <div class="app-list">
            <h3>Our Applications</h3>
            <div class="app-card">
                <span class="app-title">Only 5G</span>
                <a href="/only-5g" class="btn">Privacy Policy</a>
            </div>
        </div>
    </div>
</body>
</html>
